          - "eco give %player% 2000000"
      5:
        commands:
          - "eco give %player% 2000000"
      6:
        commands:
          - "eco give %player% 1500000"
      7:
        commands:
          - "eco give %player% 1000000"
      8:
        commands:
          - "eco give %player% 750000"
      9:
        commands:
          - "eco give %player% 500000"
      10:
