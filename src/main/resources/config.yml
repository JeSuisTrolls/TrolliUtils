no-permission: "<red>Commande inconnue."
error: "<dark_red>⚠ <reset><red>Error pendant l'exécution de cette commande"

below:
  worlds-whitelist:
    - "SuperiorWorld"
    - "SuperiorWorld_nether"
  enable: true
  permission: "trolliutils.below"
  success: "<dark_green><bold>✔ <reset><green>Vous avez été téléporté à la hauteur minimum."

transfert:
  enable: true
  permission: "trolliutils.transfert"
  success: "<dark_green><bold>✔ <reset><green>Vous avez bien transferé les données."
  success-target: "<dark_green><bold>✔ <reset><green>Vous avez été transféré de toutes vos données."
  placeholder-to-transfert:
    gemme:
      placeholder: "%squidcustomeconomy_balance_gemme%"
      transfert-commands-old-account:
        - "squidceco take %old_account% gemme %value%"
      transfert-commands-new-account:
        - "squidceco give %new_account% gemme %value%"
    gemme_compte:
      placeholder: "%squidcustomeconomy_balance_gemme_compte%"
      transfert-commands-old-account:
        - "squidceco take %old_account% gemme_compte %value%"
      transfert-commands-new-account:
        - "squidceco give %new_account% gemme_compte %value%"
    key_fragment:
      placeholder: "%squidcustomeconomy_balance_key_fragment%"
      transfert-commands-old-account:
        - "squidceco take %old_account% key_fragment %value%"
      transfert-commands-new-account:
        - "squidceco give %new_account% key_fragment %value%"
    default:
      placeholder: "%squidcustomeconomy_balance_default%"
      transfert-commands-old-account:
        - "eco take %old_account% %value%"
      transfert-commands-new-account:
        - "eco give %new_account% %value%"
    crane:
      placeholder: "%beasttokens_tokens%"
      transfert-commands-old-account:
        - "cradmin remove %old_account% %value%"
      transfert-commands-new-account:
        - "cradmin give %new_account% %value%"
    hunter:
      placeholder: "%jobs_user-jlevel_chasseur%"
      transfert-commands-old-account:
        - "jobs stats %old_account% Chasseur takelevel %value_int%"
      transfert-commands-new-account:
        - "jobs stats %new_account% Chasseur setlevel %value_int%"
    fishman:
      placeholder: "%jobs_user-jlevel_pecheur%"
      transfert-commands-old-account:
        - "jobs stats %old_account% Pecheur takelevel %value_int%"
      transfert-commands-new-account:
        - "jobs stats %new_account% Pecheur setlevel %value_int%"
    farmer:
      placeholder: "%jobs_user-jlevel_agriculteur%"
      transfert-commands-old-account:
        - "jobs stats %old_account% Agriculteur takelevel %value_int%"
      transfert-commands-new-account:
        - "jobs stats %new_account% Agriculteur setlevel %value_int%"
    explorer:
      placeholder: "%jobs_user-jlevel_explorateur%"
      transfert-commands-old-account:
        - "jobs stats %old_account% Explorateur takelevel %value_int%"
      transfert-commands-new-account:
        - "jobs stats %new_account% Explorateur setlevel %value_int%"
    minor:
      placeholder: "%jobs_user-jlevel_mineur%"
      transfert-commands-old-account:
        - "jobs stats %old_account% Mineur takelevel %value_int%"
      transfert-commands-new-account:
        - "jobs stats %new_account% Mineur setlevel %value_int%"
    lumberjack:
      placeholder: "%jobs_user-jlevel_bucheron%"
      transfert-commands-old-account:
        - "jobs stats %old_account% Bucheron takelevel %value_int%"
      transfert-commands-new-account:
        - "jobs stats %new_account% Bucheron setlevel %value_int%"
    personnage:
      placeholder: "%playerlevel_level%"
      transfert-commands-old-account:
        - "playerlevel xptake %old_account% %value_xp_old%"
      transfert-commands-new-account:
        - "playerlevel xpgive %new_account% %value_xp_new%"
    groups:
      placeholder: ""
      transfert-commands-old-account:
        - "lp user %old_account% clone %new_account%"
      transfert-commands-new-account:
        - "lp user %old_account% clear"

leaderboard-rewards:
  enable: true
  permission: "trolliutils.leaderboard-rewards"
  success: "<dark_green><bold>✔ <reset><green>Vous avez bien reçus les données récompenses de classement. <dark_gray>(<gray>%leaderboard_type% #%leaderboard_rank%<dark_gray>)"
  rewards-commands:
    caps:
      name: "Capsules"
      1:
        commands:
          - "squidcustomeco give %player% gemme 3000"
          - "lp user %player% parent addtemp premium_new 7d accumulate"
          - "lp user %player% permission settemp tags.capsules true 1mo accumulate"
